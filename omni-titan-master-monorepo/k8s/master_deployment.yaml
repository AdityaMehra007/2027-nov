apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-omega-server
  namespace: omni-sovereign
  labels:
    app: omni-omega-server
spec:
  replicas: 5
  selector:
    matchLabels:
      app: omni-omega-server
  template:
    metadata:
      labels:
        app: omni-omega-server
    spec:
      containers:
        - name: omega-server
          image: registry.omni-titan.io/core/omni-omega-server:v1.0.0
          ports:
            - containerPort: 8000
            - containerPort: 9090
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
            requests:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: omni-omega-service
  namespace: omni-sovereign
spec:
  type: ClusterIP
  selector:
    app: omni-omega-server
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 9090
      targetPort: 9090

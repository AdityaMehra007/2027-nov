apiVersion: apps/v1
kind: Deployment
metadata:
  name: telematics-os
  namespace: omni-sovereign
spec:
  replicas: 3
  selector:
    matchLabels:
      app: telematics-os
  template:
    metadata:
      labels:
        app: telematics-os
    spec:
      containers:
        - name: telematics-os
          image: registry.omni-titan.io/projects/telematics-os:v1.0.0
          ports:
            - containerPort: 9084

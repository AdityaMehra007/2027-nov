apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-erp
  namespace: omni-sovereign
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexus-erp
  template:
    metadata:
      labels:
        app: nexus-erp
    spec:
      containers:
        - name: nexus-erp
          image: registry.omni-titan.io/projects/nexus-erp:v1.0.0
          ports:
            - containerPort: 9051

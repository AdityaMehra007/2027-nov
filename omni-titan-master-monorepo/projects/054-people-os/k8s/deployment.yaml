apiVersion: apps/v1
kind: Deployment
metadata:
  name: people-os
  namespace: omni-sovereign
spec:
  replicas: 3
  selector:
    matchLabels:
      app: people-os
  template:
    metadata:
      labels:
        app: people-os
    spec:
      containers:
        - name: people-os
          image: registry.omni-titan.io/projects/people-os:v1.0.0
          ports:
            - containerPort: 9054

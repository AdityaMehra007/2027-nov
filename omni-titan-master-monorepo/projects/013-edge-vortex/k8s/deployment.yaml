apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-vortex
  namespace: omni-sovereign
spec:
  replicas: 3
  selector:
    matchLabels:
      app: edge-vortex
  template:
    metadata:
      labels:
        app: edge-vortex
    spec:
      containers:
        - name: edge-vortex
          image: registry.omni-titan.io/projects/edge-vortex:v1.0.0
          ports:
            - containerPort: 9013

apiVersion: apps/v1
kind: Deployment
metadata:
  name: genome-stream
  namespace: omni-sovereign
spec:
  replicas: 3
  selector:
    matchLabels:
      app: genome-stream
  template:
    metadata:
      labels:
        app: genome-stream
    spec:
      containers:
        - name: genome-stream
          image: registry.omni-titan.io/projects/genome-stream:v1.0.0
          ports:
            - containerPort: 9044

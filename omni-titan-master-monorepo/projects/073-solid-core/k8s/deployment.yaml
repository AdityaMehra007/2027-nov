apiVersion: apps/v1
kind: Deployment
metadata:
  name: solid-core
  namespace: omni-sovereign
spec:
  replicas: 3
  selector:
    matchLabels:
      app: solid-core
  template:
    metadata:
      labels:
        app: solid-core
    spec:
      containers:
        - name: solid-core
          image: registry.omni-titan.io/projects/solid-core:v1.0.0
          ports:
            - containerPort: 9073

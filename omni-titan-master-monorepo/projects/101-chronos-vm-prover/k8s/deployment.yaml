apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronos-vm-prover
  namespace: omni-sovereign
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chronos-vm-prover
  template:
    metadata:
      labels:
        app: chronos-vm-prover
    spec:
      containers:
        - name: chronos-vm-prover
          image: registry.omni-titan.io/projects/chronos-vm-prover:v1.0.0
          ports:
            - containerPort: 9101

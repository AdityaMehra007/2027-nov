apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-pulse
  namespace: omni-sovereign
spec:
  replicas: 3
  selector:
    matchLabels:
      app: feature-pulse
  template:
    metadata:
      labels:
        app: feature-pulse
    spec:
      containers:
        - name: feature-pulse
          image: registry.omni-titan.io/projects/feature-pulse:v1.0.0
          ports:
            - containerPort: 9066

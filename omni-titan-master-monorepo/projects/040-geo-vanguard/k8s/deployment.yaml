apiVersion: apps/v1
kind: Deployment
metadata:
  name: geo-vanguard
  namespace: omni-sovereign
spec:
  replicas: 3
  selector:
    matchLabels:
      app: geo-vanguard
  template:
    metadata:
      labels:
        app: geo-vanguard
    spec:
      containers:
        - name: geo-vanguard
          image: registry.omni-titan.io/projects/geo-vanguard:v1.0.0
          ports:
            - containerPort: 9040

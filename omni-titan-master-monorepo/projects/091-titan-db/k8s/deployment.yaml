apiVersion: apps/v1
kind: Deployment
metadata:
  name: titan-db
  namespace: omni-sovereign
spec:
  replicas: 3
  selector:
    matchLabels:
      app: titan-db
  template:
    metadata:
      labels:
        app: titan-db
    spec:
      containers:
        - name: titan-db
          image: registry.omni-titan.io/projects/titan-db:v1.0.0
          ports:
            - containerPort: 9091

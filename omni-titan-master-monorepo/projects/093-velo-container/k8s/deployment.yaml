apiVersion: apps/v1
kind: Deployment
metadata:
  name: velo-container
  namespace: omni-sovereign
spec:
  replicas: 3
  selector:
    matchLabels:
      app: velo-container
  template:
    metadata:
      labels:
        app: velo-container
    spec:
      containers:
        - name: velo-container
          image: registry.omni-titan.io/projects/velo-container:v1.0.0
          ports:
            - containerPort: 9093

apiVersion: apps/v1
kind: Deployment
metadata:
  name: epidemic-radar
  namespace: omni-sovereign
spec:
  replicas: 3
  selector:
    matchLabels:
      app: epidemic-radar
  template:
    metadata:
      labels:
        app: epidemic-radar
    spec:
      containers:
        - name: epidemic-radar
          image: registry.omni-titan.io/projects/epidemic-radar:v1.0.0
          ports:
            - containerPort: 9050

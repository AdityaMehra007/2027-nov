apiVersion: apps/v1
kind: Deployment
metadata:
  name: persona-grid
  namespace: omni-sovereign
spec:
  replicas: 3
  selector:
    matchLabels:
      app: persona-grid
  template:
    metadata:
      labels:
        app: persona-grid
    spec:
      containers:
        - name: persona-grid
          image: registry.omni-titan.io/projects/persona-grid:v1.0.0
          ports:
            - containerPort: 9010

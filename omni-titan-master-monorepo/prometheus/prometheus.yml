global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'omni-omega-server'
    static_configs:
      - targets: ['omni-omega-server:8000']

  - job_name: 'omni-microservices'
    static_configs:
      - targets:
          - 'localhost:8001'
          - 'localhost:8010'
          - 'localhost:8020'
          - 'localhost:8030'
          - 'localhost:8040'
          - 'localhost:8050'
          - 'localhost:8060'
          - 'localhost:8070'
          - 'localhost:8080'
          - 'localhost:8090'
          - 'localhost:8100'

name: OMNI-SINGULARITY 112-System Verification CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pytest pytest-cov
      - name: Run 112-Project Cryptographic Verification
        run: python -m pytest tests/test_omni_singularity_112.py -v

name: Omniverse Enterprise CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Test & QA Verification (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Syntax & Ast Verification
        run: |
          python -m compileall src tests

      - name: Execute Automated Test Suite (Pytest)
        run: |
          pytest -v --durations=10

      - name: Verify Health Probes & CLI Import
        run: |
          python -c "from omniverse.api.app import app, api; print('ASGI App Verified')"
          python -m omniverse.cli status

  docker-build:
    name: Production Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: omniverse:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

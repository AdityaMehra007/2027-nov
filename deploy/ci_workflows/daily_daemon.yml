name: 24/7 Autonomous Operations Watchdog

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  daily-ops:
    name: Run Autonomous Operations & Executive Briefing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Omniverse
        run: |
          pip install -e .
          pip install pytest

      - name: Execute Diagnostics & Daily Executive Brief
        run: |
          python -m omniverse.cli status
          python -m omniverse.cli daily-brief

      - name: Upload Daily Executive Brief Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-executive-brief
          path: reports/executive_briefs/

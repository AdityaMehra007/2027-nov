version: '3.8'

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: "${SIGNUPS_ALLOWED:-false}"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
    volumes:
      - vw_data:/data
    ports:
      - "${PORT:-8080}:80"

volumes:
  vw_data:

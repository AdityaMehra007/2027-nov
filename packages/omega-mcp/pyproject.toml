[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) Fleet Hub — Autonomous Multi-Agent Tool Hub by Aditya Mehra"
readme = "README.md"
authors = [
    { name = "Aditya Mehra", email = "ashishiash007@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "agents", "fastapi", "ai-swarms", "claude-desktop", "antigravity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.1.0"
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0"
]
test = [
    "pytest>=7.0.0"
]

[project.scripts]
omega-mcp = "omega_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnia-foundry"
version = "0.1.0"
description = "Local programme, evidence and experiment management prototype for PROJECT OMNIA"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
omnia-foundry = "omnia_foundry.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

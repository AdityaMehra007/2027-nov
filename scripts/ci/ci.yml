name: CASHFLOW INFINITY // OMNIVERSE Autonomous CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  singularity-audit-and-test:
    name: 🌌 Zero-Tolerance Deep Production Audit & Core Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov fastapi pydantic uvicorn httpx

      - name: Execute Zero-Tolerance Deep Production Audit (1,603 Files)
        run: |
          python deep_production_audit.py

      - name: Run 112-Project Cryptographic Verification Suite
        run: |
          python -m pytest tests/test_omni_singularity_112.py -v

      - name: Run Core Autonomous Engine Benchmarks & Micro-SaaS Tests
        run: |
          python -m pytest tests/test_store.py tests/test_store_active_ttl.py tests/test_byox_benchmarks.py -v
